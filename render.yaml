services:
  - type: web
    name: grupo-anc-dashboard
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m src.pipeline && uv run gunicorn src.dashboard.app:server --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DUCKDB_PATH
        value: data/warehouse.duckdb
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json
      - key: IZI_BASE_URL
        sync: false
      - key: IZI_EMAIL
        sync: false
      - key: IZI_PASSWORD
        sync: false
